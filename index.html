<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Restudio Tables</title>
    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net;
        style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net;
        font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:;
        img-src 'self' https://i.postimg.cc data:;
        connect-src 'self';
        frame-src 'none';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
    ">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-header">
    <img src="https://i.postimg.cc/s2j0rzBZ/swrh-restudio.png" alt="Restudio Logo">
    <span class="brand">Tables</span>
</div>

<div class="toolbar" id="toolbar">
    <div class="tool-group">
        <button class="tool-btn" id="newTableBtn"><i class="ti ti-table"></i> New Table</button>
        <button class="tool-btn" id="exportBtn"><i class="ti ti-device-floppy"></i> Export .RETB</button>
    </div>
    <div class="tool-group">
        <button class="tool-btn" id="undoBtn"><i class="ti ti-arrow-back-up"></i> Undo</button>
        <button class="tool-btn" id="redoBtn"><i class="ti ti-arrow-forward-up"></i> Redo</button>
        <button class="tool-btn" id="cutBtn"><i class="ti ti-scissors"></i> Cut</button>
        <button class="tool-btn" id="copyBtn"><i class="ti ti-copy"></i> Copy</button>
        <button class="tool-btn" id="pasteBtn"><i class="ti ti-clipboard"></i> Paste</button>
        <button class="tool-btn" id="deleteContentBtn"><i class="ti ti-trash"></i> Delete</button>
    </div>
    <div class="tool-group">
        <button class="tool-btn" id="addRowBtn"><i class="ti ti-row-insert-bottom"></i> Add Row</button>
        <button class="tool-btn" id="addColBtn"><i class="ti ti-column-insert-right"></i> Add Column</button>
        <button class="tool-btn" id="delRowBtn"><i class="ti ti-row-remove"></i> Delete Row</button>
        <button class="tool-btn" id="delColBtn"><i class="ti ti-column-remove"></i> Delete Column</button>
        <button class="tool-btn" id="dupRowBtn"><i class="ti ti-copy"></i> Duplicate Row</button>
        <button class="tool-btn" id="dupColBtn"><i class="ti ti-copy"></i> Duplicate Col</button>
        <button class="tool-btn" id="resizeRowBtn"><i class="ti ti-arrows-vertical"></i> Resize Row</button>
        <button class="tool-btn" id="resizeColBtn"><i class="ti ti-arrows-horizontal"></i> Resize Col</button>
        <button class="tool-btn" id="minimizeColBtn"><i class="ti ti-arrows-horizontal"></i> Minimize COL</button>
    </div>
    <div class="tool-group">
        <button class="tool-btn" id="sortAscBtn"><i class="ti ti-arrow-up"></i> Sort Asc</button>
        <button class="tool-btn" id="sortDescBtn"><i class="ti ti-arrow-down"></i> Sort Desc</button>
        <button class="tool-btn" id="filterBtn"><i class="ti ti-filter"></i> Filter</button>
        <button class="tool-btn" id="clearFilterBtn"><i class="ti ti-filter-off"></i> Clear Filter</button>
    </div>
    <div class="tool-group">
        <button class="tool-btn" id="mergeCellsBtn"><i class="ti ti-cells-merge"></i> Merge</button>
        <button class="tool-btn" id="unmergeCellsBtn"><i class="ti ti-cells-unmerge"></i> Unmerge</button>
        <button class="tool-btn" id="alignLeftBtn"><i class="ti ti-align-left"></i></button>
        <button class="tool-btn" id="alignCenterBtn"><i class="ti ti-align-center"></i></button>
        <button class="tool-btn" id="alignRightBtn"><i class="ti ti-align-right"></i></button>
    </div>
    <div class="tool-group">
        <button class="tool-btn" id="insertTextBtn"><i class="ti ti-text-size"></i> Text</button>
        <button class="tool-btn" id="insertNumberBtn"><i class="ti ti-numbers"></i> Number</button>
        <button class="tool-btn" id="insertCheckboxBtn"><i class="ti ti-checkbox"></i> Checkbox</button>
        <button class="tool-btn" id="insertDateBtn"><i class="ti ti-calendar"></i> Date</button>
        <button class="tool-btn" id="insertLinkBtn"><i class="ti ti-link"></i> Link</button>
    </div>
    <div class="tool-group">
        <div class="color-picker-wrapper">
            <button class="tool-btn" id="cellColorBtn" title="Cell Background Color">
                <i class="ti ti-color-fill"></i>
                <span style="font-size:11px;">Cell Color</span>
            </button>
            <input type="color" id="cellColorPicker" value="#2d2d2d" title="Select cell background color">
        </div>
        <div class="color-picker-wrapper">
            <button class="tool-btn" id="textColorBtn" title="Text Color">
                <i class="ti ti-color-swatch"></i>
                <span style="font-size:11px;">Text Color</span>
            </button>
            <input type="color" id="textColorPicker" value="#f0f0f0" title="Select text color">
        </div>
        <button class="tool-btn" id="clearColorBtn" title="Clear Cell & Text Colors">
            <i class="ti ti-eraser"></i>
            <span style="font-size:11px;">Clear Colors</span>
        </button>
    </div>
    <div class="tool-group">
        <button class="tool-btn" id="fullscreenBtn"><i class="ti ti-arrows-maximize"></i> Fullscreen</button>
        <button class="tool-btn" id="searchBtn"><i class="ti ti-search"></i> Search</button>
        <button class="tool-btn" id="wordWrapBtn"><i class="ti ti-wrap-text"></i> Word Wrap</button>
        <button class="tool-btn" id="rowNumberingBtn"><i class="ti ti-list-numbers"></i> Row Numbers</button>
    </div>
</div>

<div class="main-container">
    <div class="sheet-wrapper" id="sheetWrapper">
        <table class="spreadsheet" id="spreadsheet" cellspacing="0"></table>
    </div>
    <div class="status-bar" id="statusBar">
        <span id="cellCoord">Ready</span>
        <span id="filterStatus"></span>
        <span id="selectionRange" class="selection-info"></span>
        <span id="colorInfo" style="font-size:10px; color:#888;"></span>
        <span id="performanceHint" style="font-size:10px; color:#666;"></span>
    </div>
</div>

<button class="exit-fullscreen-btn" id="exitFullscreenBtn">
    <i class="ti ti-arrows-minimize"></i> Exit Fullscreen
</button>

<script src="script.js"></script>
</body>
</html>
